name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build_matrix.yml
    secrets: inherit
  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bindgen-llvm*
          merge-multiple: true
          path: dist/variants
      - run: scripts/assemble_release.sh dist/variants dist/release
