name: Build and release

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - id: matrix
        run: echo "matrix=$(jq -c '{include:.variants}' releases/manifest.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build LLVM ${{ matrix.llvm_version }} archives
        working-directory: ${{ matrix.workspace }}
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          LLVM_VERSION: ${{ matrix.llvm_version }}
        run: '"$GITHUB_WORKSPACE/.github/workflows/build_release.sh" "$LLVM_VERSION"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindgen-llvm${{ matrix.llvm_version }}
          path: |
            ${{ matrix.workspace }}/bindgen_llvm*.tar.zst
            ${{ matrix.workspace }}/SHA256_llvm*.txt
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bindgen-llvm*
          merge-multiple: true
          path: dist
      - name: Combine manifest and checksums
        run: |
          jq --arg source_commit "$GITHUB_SHA" '. + {source_commit:$source_commit}' releases/manifest.json > dist/manifest.json
          cat dist/SHA256_llvm*.txt > dist/SHA256.txt
          (cd dist && shasum -a 256 -c SHA256.txt && shasum -a 256 manifest.json >> SHA256.txt)
      - name: Create draft
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/bindgen_llvm*.tar.zst
            dist/manifest.json
            dist/SHA256.txt
      - name: Publish
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
